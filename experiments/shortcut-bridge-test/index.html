<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>QuickCal 日历桥接验证</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: #f5f5f7; color: #1d1d1f; }
      main { width: min(100%, 480px); margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom)); }
      .eyebrow { margin: 0 0 8px; color: #6e6e73; font-size: .78rem; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 0; font-size: clamp(1.9rem, 8vw, 2.65rem); line-height: 1.06; letter-spacing: -.045em; }
      .lead { margin: 14px 0 24px; color: #6e6e73; font-size: 1rem; line-height: 1.55; }
      .card { padding: 18px; border: 1px solid rgba(0,0,0,.08); border-radius: 22px; background: rgba(255,255,255,.88); box-shadow: 0 12px 36px rgba(0,0,0,.06); }
      .status { display: flex; align-items: flex-start; gap: 12px; }
      .dot { width: 12px; height: 12px; margin-top: 5px; flex: none; border-radius: 50%; background: #8e8e93; box-shadow: 0 0 0 5px rgba(142,142,147,.12); }
      .status.success .dot { background: #34c759; box-shadow: 0 0 0 5px rgba(52,199,89,.12); }
      .status.error .dot { background: #ff3b30; box-shadow: 0 0 0 5px rgba(255,59,48,.12); }
      .status strong, .status span { display: block; }
      .status strong { font-size: 1rem; }
      .status span { margin-top: 4px; color: #6e6e73; font-size: .88rem; line-height: 1.45; }
      .actions { display: grid; gap: 10px; margin-top: 18px; }
      button, a { min-height: 52px; border-radius: 16px; font: inherit; font-weight: 700; text-align: center; }
      button { border: 0; background: #007aff; color: white; cursor: pointer; }
      button:active { transform: scale(.985); }
      a { display: grid; place-items: center; border: 1px solid rgba(0,0,0,.1); color: #1d1d1f; text-decoration: none; background: #fff; }
      .facts { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; color: #6e6e73; font-size: .84rem; line-height: 1.45; }
      .facts li { display: flex; gap: 9px; }
      .facts b { color: #1d1d1f; }
      code { padding: 2px 5px; border-radius: 6px; background: rgba(118,118,128,.1); font: .78rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">QUICKCAL · 隔离验证</p>
      <h1>只验证一件事：能否真正加入日历并回来。</h1>
      <p class="lead">该页面不读写正式 QuickCal 数据。测试成功后，Apple 日历中会出现一条 30 分钟的“QuickCal 桥接测试”。</p>

      <section class="card">
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <div><strong>尚未运行</strong><span>请使用 iPhone Safari，并先安装完整的日历助手母版。</span></div>
        </div>
        <div class="actions">
          <button id="runTest" type="button">运行桥接测试</button>
          <a id="openShortcut" href="#">查看已安装的日历助手</a>
        </div>
        <ul class="facts">
          <li><b>名称</b><span><code>QuickCal-Calendar</code></span></li>
          <li><b>成功</b><span>创建事件后自动回到本页，不需要刷新。</span></li>
          <li><b>失败</b><span>保留失败原因，不把结果误报为成功。</span></li>
        </ul>
      </section>
    </main>

    <script type="module">
      import {
        createTestRequest,
        isVerifiedSuccess,
        openShortcutURL,
        parseBridgeCallback
      } from "./bridge.mjs";

      (() => {
        const status = document.querySelector("#status");
        const runButton = document.querySelector("#runTest");
        const openShortcut = document.querySelector("#openShortcut");

        function setStatus(kind, title, detail) {
          status.className = `status ${kind || ""}`.trim();
          status.querySelector("strong").textContent = title;
          status.querySelector("span:last-child").textContent = detail;
        }

        function runTest() {
          const { expectedReceipt, shortcutURL } = createTestRequest(window.location.href);
          sessionStorage.setItem("quickcal.bridge.receipt", expectedReceipt);
          setStatus("", "正在打开快捷指令", "完成后应自动返回这里。");
          window.location.href = shortcutURL;
        }

        const callback = parseBridgeCallback(window.location.href);
        if (callback.outcome === "success") {
          const expectedReceipt = sessionStorage.getItem("quickcal.bridge.receipt") || "";
          sessionStorage.removeItem("quickcal.bridge.receipt");
          if (isVerifiedSuccess(window.location.href, expectedReceipt)) {
            setStatus("success", "已确认写入日历", "快捷指令返回了与本次测试匹配的日历写入回执。");
          } else {
            setStatus("error", "没有确认写入", "快捷指令虽然结束了，但没有返回本次测试的有效写入回执。");
          }
        } else if (callback.outcome === "cancel") {
          setStatus("error", "测试已取消", "没有记录成功；可以重新运行测试。");
        } else if (callback.outcome === "error") {
          setStatus("error", "桥接失败", callback.message || "快捷指令返回了错误，请检查动作或日历权限。");
        }

        openShortcut.href = openShortcutURL();
        runButton.addEventListener("click", runTest);
      })();
    </script>
  </body>
</html>
