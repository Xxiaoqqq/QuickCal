<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>安装 QuickCal 快捷指令</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; color: #1c1c1e; background: #f5f5f7; }
      main { width: min(100%, 520px); min-height: 100svh; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
      .back { width: fit-content; min-height: 44px; display: inline-flex; align-items: center; gap: 5px; color: #007aff; font-size: 1rem; font-weight: 650; text-decoration: none; }
      .card { margin-top: 22px; padding: 22px 18px; border: 1px solid rgba(60,60,67,.12); border-radius: 24px; background: #fff; box-shadow: 0 14px 38px rgba(0,0,0,.06); }
      .icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: #007aff; }
      .icon svg { width: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .eyebrow { margin: 18px 0 5px; color: #ff3b30; font-size: .75rem; font-weight: 800; letter-spacing: .1em; }
      h1 { margin: 0; font-size: 1.65rem; line-height: 1.12; letter-spacing: -.035em; }
      .lead { margin: 10px 0 0; color: #6e6e73; font-size: .94rem; line-height: 1.55; }
      ol { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
      li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; color: #48484a; font-size: .9rem; line-height: 1.45; }
      li span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: #007aff; background: rgba(0,122,255,.1); font-size: .78rem; font-weight: 800; }
      .open-shortcut, .return { width: 100%; min-height: 52px; display: grid; place-items: center; border-radius: 16px; font-weight: 760; text-decoration: none; }
      .open-shortcut { margin-top: 22px; color: #fff; background: #007aff; }
      .return { margin-top: auto; color: #007aff; border: 1px solid rgba(0,122,255,.22); background: #fff; }
      .hint { margin: 12px 4px 22px; color: #6e6e73; font-size: .78rem; line-height: 1.45; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="./" aria-label="返回 QuickCal">‹ 返回 QuickCal</a>
      <section class="card">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M7 11h4M9 9v4"/></svg>
        </div>
        <p class="eyebrow">仅需安装一次</p>
        <h1>安装 QuickCal-Calendar</h1>
        <p class="lead">QuickCal 通过这条快捷指令把标题和时间直接写入 Apple 日历。</p>
        <ol>
          <li><span>1</span><div>如果已有同名旧版，先在“快捷指令”App 中删除。</div></li>
          <li><span>2</span><div>点“在快捷指令中打开”，确认名称为 <strong>QuickCal-Calendar</strong>，然后添加。</div></li>
          <li><span>3</span><div>安装完成后回到这个页面，再点下方“返回 QuickCal”。</div></li>
        </ol>
        <a class="open-shortcut" id="openShortcutFile" href="./QuickCal-Calendar.shortcut" target="_blank" rel="noopener">在快捷指令中打开</a>
      </section>
      <p class="hint" id="installHint">安装页会单独打开，QuickCal 原页面不会被覆盖。</p>
      <a class="return" href="./?shortcutSetup=done">返回 QuickCal</a>
    </main>
    <script>
      document.querySelector("#openShortcutFile").addEventListener("click", () => {
        document.querySelector("#installHint").textContent = "安装完成后，回到这里点“返回 QuickCal”。";
      });
    </script>
  </body>
</html>
